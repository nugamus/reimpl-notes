# ScummVM config for running the cryomni3d engine during development (like the other engines'
# tools/scummvm.ini). Scenarios pick a domain with `domain = "..."`; the first is the default.
# C:\VersaillesRun holds junctions to the English DOS CDs: datas_v1, datas_v2, install.
[scummvm]
enable_unsupported_game_warning=false
gfx_mode=opengl
extrapath=C:\scummvm-dev\cryomni3d\dists\engine-data
gui_language=C
window_maximized=false

[versailles]
gameid=versailles
engineid=cryomni3d
description=Versailles 1685 (DOS/English)
language=en
platform=pc
path=C:\VersaillesRun
guioptions=sndNoMIDI sndNoSFX noAspect lang_English plat_DOS
