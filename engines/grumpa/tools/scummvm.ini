# ScummVM config for running the grumpa engine during development (like
# engines/gilbert/tools/scummvm.ini). enable_unsupported_game_warning=false skips the
# "engine in development" dialog that otherwise blocks unattended runs.
#
# Dev keys in the [grumpa] domain (dev.cpp, DEV commit only):
#   grumpa_view=<n>_<v>   show one pre-rendered scene view and hold (e.g. 100_1)
#   grumpa_dump=<n>_<v>   render one view to grumpa_dump.png and quit (no display needed)
[scummvm]
enable_unsupported_game_warning=false
gfx_mode=opengl
gui_language=C

[grumpa]
gameid=grumpa
engineid=grumpa
description=Grumpa (Windows)
path=C:\Users\Nugamus\Desktop\Code Projects\Game Reimplementations\games\grumpa\discs\cab
guioptions=sndNoMIDI plat_windows
