# ScummVM config for running the gilbert engine during development (like engines/peintre/tools/scummvm.ini).
# enable_unsupported_game_warning=false skips the "engine in development" dialog that
# otherwise blocks unattended runs; extrapath finds fonts.dat (Liberation Sans for Arial).
[scummvm]
lastselectedgame=gilbert
last_window_width=1280
enable_unsupported_game_warning=false
gfx_mode=opengl
extrapath=C:\scummvm\dists\engine-data
last_window_height=960
versioninfo=2026.3.1git
gui_language=C
window_maximized=false

[gilbert]
gameid=gilbert
description=Gilbert og den kemystiske ø (Windows/Danish)
language=da
path=C:\Users\Nugamus\Desktop\Code Projects\Game Reimplementations\games\gilbert\discs\cd\Program
engineid=gilbert
guioptions=sndNoMIDI lang_Danish plat_windows

